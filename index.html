<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policía Local · Herramientas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f8;--card:#fff;--tx:#14213d;--mut:#5b6785;--navy:#12306b;--navy2:#0c2250;--gold:#f0b400;--line:#d5dcea;
--M:#f0b400;--T:#e2792b;--N:#3b4a9c;--L:#2f8f5b;--ok:#2f8f5b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1428;--card:#14203b;--tx:#e8edf8;--mut:#9aa8c7;--line:#27365a;--navy:#1d4396}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1428;--card:#14203b;--tx:#e8edf8;--mut:#9aa8c7;--line:#27365a;--navy:#1d4396}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
.top{background:linear-gradient(var(--navy2),var(--navy));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--gold)}
.top h1{font-size:17px;margin:0;flex:1;line-height:1.2}.top small{display:block;font-weight:400;opacity:.8;font-size:12px}
.btn{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600;background:var(--gold);color:#12203f}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.w{background:rgba(255,255,255,.15);color:#fff;padding:6px 12px}
.btn.red{background:#c0392b;color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:16px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(160deg,var(--navy2),var(--navy))}
.lcard{background:var(--card);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;text-align:center;border-top:6px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lcard h2{margin:8px 0 2px;font-size:20px}.lcard p{margin:0 0 18px;color:var(--mut);font-size:14px}
.lcard input{width:100%;padding:11px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.lcard .btn{width:100%;margin-top:6px}
/* menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--navy);border-radius:12px;padding:18px 10px;text-align:center;cursor:pointer;font-weight:600}
.tile .ic{font-size:38px;display:block;margin-bottom:6px}
.tile.soon{opacity:.55;cursor:default;border-bottom-color:var(--line)}
.tile small{display:block;font-weight:400;color:var(--mut)}
/* tabs */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar h3{margin:0;text-transform:capitalize;font-size:18px}
.total{background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;border-left:6px solid var(--gold)}
.total b{font-size:24px;color:var(--gold)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;font-size:12px;color:var(--mut);font-weight:700;padding:2px 0}
.dc{min-height:70px;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;border-top:4px solid var(--line)}
.dc.o{opacity:.35}.dc.today{outline:2px solid var(--gold)}
.dc .n{font-size:12px;font-weight:700;display:flex;justify-content:space-between}
.dc .s{font-size:12px;font-weight:700}
.dc .x{font-size:13px;line-height:1.1;word-break:break-all}
.dc[data-s="M"]{border-top-color:var(--M)}.dc[data-s="T"]{border-top-color:var(--T)}.dc[data-s="N"]{border-top-color:var(--N)}.dc[data-s="L"]{border-top-color:var(--L)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:12px}
td:last-child,th:last-child{text-align:right}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row input,.row select,.fld input,.fld select{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.row input.nm{flex:1}.row input.am{width:84px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.fld label{font-size:13px;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--navy);color:var(--tx);background:var(--bg);border-radius:18px;padding:6px 10px;cursor:pointer;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mb{background:var(--card);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border-top:5px solid var(--gold)}
@media(min-width:600px){.modal{align-items:center}.mb{border-radius:16px}}
:root{--Lbg:#dcefe3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--Lbg:#1b3a2c}}
:root[data-theme="dark"]{--Lbg:#1b3a2c}
.dc[data-s="M"]{background:var(--M);border-color:var(--M);color:#14213d}
.dc[data-s="T"]{background:#e8772a;border-color:#e8772a;color:#fff}
.dc[data-s="N"]{background:var(--N);border-color:var(--N);color:#fff}
.dc[data-s="L"]{background:var(--Lbg);border-color:var(--line);color:var(--tx)}
.dc{min-height:92px;padding:4px 3px;align-items:center;text-align:center;gap:1px}
.dc .n{width:100%;font-size:13px}
.dc .s{display:flex;flex-direction:column;align-items:center}
.dc .si{font-size:28px;line-height:1.1}.dc .sl{font-size:11px;font-weight:700;text-transform:uppercase}
.dc .x{font-size:15px;line-height:1}
.dc.today{outline:3px solid var(--tx);outline-offset:-1px}
@media(max-width:600px){.wrap{padding:8px}.cal{gap:3px}.dc{min-height:84px}.dc .si{font-size:26px}}
</style>
</head>
<body>

<div id="login">
 <div class="lcard">
  <img class="esc" style="width:76px;height:84px;object-fit:contain" alt="Escudo Policía Local">
  <h2>Policía Local</h2><p>Pilar de la Horadada · Herramientas de servicio</p>
  <input id="u" placeholder="Tu nombre o nº de placa" autocomplete="off">
  <button class="btn" onclick="enter()">Entrar</button>
  <button class="btn sec" onclick="document.getElementById('escf').click()">🖼️ Cargar escudo</button><input type="file" id="escf" accept="image/*" class="hide" onchange="loadEsc(this)">
 </div>
</div>

<div id="app" class="hide">
 <div class="top"><img class="esc" style="width:36px;height:40px;object-fit:contain" alt="Escudo"><h1>Policía Local<small id="who">Modo DEMO</small></h1>
  <button class="btn w" id="back" onclick="go('menu')">← Menú</button><button class="btn w" onclick="logout()">Salir</button></div>
 <div class="wrap">
  <div id="menu">
   <h2 style="margin-top:0">Aplicaciones</h2>
   <div class="grid">
    <div class="tile" onclick="go('turnos')"><span class="ic">📅</span>Turnos y gratificaciones</div>
    <div class="tile soon"><span class="ic">📝</span>Informes<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic">🔎</span>Inteligencia<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic">📋</span>Procedimientos<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic">🚔</span>Servicios<small>Próximamente</small></div>
   </div>
  </div>
  <div id="turnos" class="hide">
   <div id="topc"></div><div class="tabs"><button class="tab on" data-t="cal">📅 Calendario</button><button class="tab" data-t="cat">💶 Gratificaciones</button><button class="tab" data-t="cfg">⚙️ Ajustes</button></div>
   <div id="t-cal"></div><div id="t-cat" class="hide"></div><div id="t-cfg" class="hide"></div>
  </div>
 </div>
</div>
<div id="modal" class="modal hide"></div>

<script>
var SH={M:{n:'Mañana',i:'🌅'},T:{n:'Tarde',i:'🌇'},N:{n:'Noche',i:'🌙'},L:{n:'Libre',i:'🏖️'}};
var ICONS=['🏍️','🎉','🚓','⭐','🌙','🚨','👮','📋'];
var DEF={cfg:{start:'2026-11-18',first:'M',seq:['M','T','N']},
 cat:[{id:1,n:'Mañana extraordinaria festivo',a:80,i:'🎉'},{id:2,n:'Moto',a:30,i:'🏍️'},{id:3,n:'Servicio extra',a:60,i:'🚓'}],days:{},nid:4};
var S;
try{S=JSON.parse(localStorage.getItem('plpilar')||'null')}catch(e){S=null}
S=S||JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem('plpilar',JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function eur(v){return v.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function pad(n){return n<10?'0'+n:''+n}
function key(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d)}
var cur=new Date();var Y=cur.getFullYear(),Mo=cur.getMonth();
function base(k){var p=k.split('-'),q=S.cfg.start.split('-');
 var d=Math.round((Date.UTC(+p[0],p[1]-1,+p[2])-Date.UTC(+q[0],q[1]-1,+q[2]))/864e5);
 var seq=S.cfg.seq,len=14*seq.length,c=((d%len)+len)%len;
 var off=seq.indexOf(S.cfg.first);if(off<0)off=0;
 if(c%14>=7)return'L';return seq[(Math.floor(c/14)+off)%seq.length]}
function shiftOf(k){var o=S.days[k];return(o&&o.s)?o.s:base(k)}
function enter(demo){$('login').classList.add('hide');$('app').classList.remove('hide');
 $('who').textContent=demo?'Modo DEMO':('Agente: '+($('u').value||'—'));go('menu')}
function logout(){$('app').classList.add('hide');$('login').classList.remove('hide')}
function go(v){$('menu').classList.toggle('hide',v!=='menu');$('turnos').classList.toggle('hide',v!=='turnos');$('back').classList.toggle('hide',v==='menu');if(v==='turnos')draw()}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){
 document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});
 ['cal','cat','cfg'].forEach(function(t){$('t-'+t).classList.toggle('hide',t!==b.dataset.t)});draw()}});
function draw(){drawCal();drawCat();drawCfg()}
function drawCal(){
 var first=new Date(Y,Mo,1),dim=new Date(Y,Mo+1,0).getDate(),lead=(first.getDay()+6)%7;
 var name=first.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
 var tot=0,agg={},cnt={L:0,M:0,T:0,N:0};
 for(var d=1;d<=dim;d++){var k=key(Y,Mo,d);cnt[shiftOf(k)]++;var o=S.days[k];
  if(o&&o.x)o.x.forEach(function(e){tot+=e.a;var a=agg[e.n]||(agg[e.n]={c:0,t:0,i:e.i});a.c++;a.t+=e.a})}
 var h='<div class="total"><span>💰 Gratificaciones de '+esc(name)+'</span><b>'+eur(tot)+'</b></div>';
 h+='<div class="card"><div class="bar"><button class="btn sec" onclick="mv(-1)">◀</button><h3>'+esc(name)+'</h3><button class="btn sec" onclick="mv(1)">▶</button></div><div class="cal">';
 ['L','M','X','J','V','S','D'].forEach(function(x){h+='<div class="dh">'+x+'</div>'});
 for(var i=0;i<lead;i++)h+='<div></div>';
 var t=new Date(),tk=key(t.getFullYear(),t.getMonth(),t.getDate());
 for(d=1;d<=dim;d++){k=key(Y,Mo,d);var s=shiftOf(k),o2=S.days[k];
  h+='<div class="dc'+(k===tk?' today':'')+'" data-s="'+s+'" onclick="openDay(\''+k+'\')"><div class="n"><span>'+d+'</span>'+''+'</div><div class="s">'+SH[s].i+' '+SH[s].n.slice(0,3)+'</div><div class="x">'+((o2&&o2.x)?o2.x.map(function(e){return e.i}).join(''):'')+'</div></div>'}
 h+='</div><div class="leg"><span>🌅 Mañana</span><span>🌇 Tarde</span><span>🌙 Noche</span><span>🏖️ Libre</span></div></div>';
 h+='<div class="card"><b>Resumen del mes</b><table><tr><th>Concepto</th><th>Nº</th><th>Importe</th></tr>';
 var ks=Object.keys(agg);
 if(!ks.length)h+='<tr><td colspan="3" style="color:var(--mut)">Sin gratificaciones este mes. Toca un día para añadirlas.</td></tr>';
 ks.forEach(function(n){h+='<tr><td>'+agg[n].i+' '+esc(n)+'</td><td>'+agg[n].c+'</td><td>'+eur(agg[n].t)+'</td></tr>'});
 h+='<tr><td><b>TOTAL</b></td><td></td><td><b>'+eur(tot)+'</b></td></tr></table>';
 h+='<div class="leg"><span>Días de trabajo: '+(cnt.M+cnt.T+cnt.N)+'</span><span>Libres: '+cnt.L+'</span></div></div>';
 $('t-cal').innerHTML=h}
function mv(n){Mo+=n;if(Mo<0){Mo=11;Y--}if(Mo>11){Mo=0;Y++}drawCal()}
var dk=null;
function openDay(k){dk=k;drawModal()}
function drawModal(){
 var o=S.days[dk]||{},s=o.s||'',x=o.x||[];
 var dt=new Date(dk+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
 var h='<div class="mb"><h3 style="margin:0 0 10px;text-transform:capitalize">'+esc(dt)+'</h3>';
 h+='<div class="fld"><label>Turno del día</label><select id="ms" onchange="setShift(this.value)"><option value="">Por defecto</option>';
 ['M','T','N','L'].forEach(function(c){h+='<option value="'+c+'"'+(s===c?' selected':'')+'>'+SH[c].i+' '+SH[c].n+'</option>'});
 h+='</select></div><b>Gratificaciones del día</b>';
 if(!x.length)h+='<div style="color:var(--mut);font-size:14px;margin-top:4px">Ninguna todavía</div>';
 x.forEach(function(e,j){h+='<div class="row"><span>'+e.i+'</span><input class="nm" value="'+esc(e.n)+'" onchange="upd('+j+',\'n\',this.value)"><input class="am" type="number" step="0.01" value="'+e.a+'" onchange="upd('+j+',\'a\',this.value)"><button class="btn sec" onclick="del('+j+')">🗑️</button></div>'});
 h+='<div style="margin-top:10px;font-size:13px;color:var(--mut)">Añadir (toca varias si hace falta):</div><div class="chips">';
 S.cat.forEach(function(c){h+='<button class="chip" onclick="addG('+c.id+')">'+c.i+' '+esc(c.n)+' · '+eur(c.a)+'</button>'});
 h+='</div><div class="row" style="justify-content:space-between"><b>Total del día: '+eur(x.reduce(function(a,e){return a+e.a},0))+'</b><button class="btn" onclick="closeM()">Hecho</button></div></div>';
 $('modal').innerHTML=h;$('modal').classList.remove('hide')}
function closeM(){$('modal').classList.add('hide');draw()}
$('modal').onclick=function(e){if(e.target===$('modal'))closeM()};
function dd(){return S.days[dk]||(S.days[dk]={s:'',x:[]})}
function clean(){var o=S.days[dk];if(o&&!o.s&&(!o.x||!o.x.length))delete S.days[dk]}
function setShift(v){dd().s=v;clean();save();drawModal()}
function addG(id){var c=S.cat.filter(function(z){return z.id===id})[0];dd().x.push({n:c.n,a:c.a,i:c.i});save();drawModal()}
function upd(j,f,v){var e=dd().x[j];e[f]=f==='a'?(parseFloat(v)||0):v;save();drawModal()}
function del(j){dd().x.splice(j,1);clean();save();drawModal()}
function drawCat(){
 var h='<div class="card"><b>Tipos de gratificación</b><p style="color:var(--mut);font-size:14px;margin:4px 0 10px">Crea los tipos y su importe. Al añadirlos a un día se guarda el importe de ese momento, así que cambiar el precio no altera meses anteriores.</p>';
 S.cat.forEach(function(c,j){h+='<div class="row"><select onchange="cu('+j+',\'i\',this.value)">'+ICONS.map(function(i){return'<option'+(i===c.i?' selected':'')+'>'+i+'</option>'}).join('')+'</select><input class="nm" value="'+esc(c.n)+'" onchange="cu('+j+',\'n\',this.value)"><input class="am" type="number" step="0.01" value="'+c.a+'" onchange="cu('+j+',\'a\',this.value)"><button class="btn sec" onclick="cd('+j+')">🗑️</button></div>'});
 h+='<button class="btn" onclick="ca()">➕ Nuevo tipo</button></div>';
 $('t-cat').innerHTML=h}
function cu(j,f,v){S.cat[j][f]=f==='a'?(parseFloat(v)||0):v;save()}
function cd(j){S.cat.splice(j,1);save();drawCat()}
function ca(){S.cat.push({id:S.nid++,n:'Nueva gratificación',a:0,i:'⭐'});save();drawCat()}
function drawCfg(){
 var f=S.cfg;
 var h='<div class="card"><b>Ciclo de turnos 7x7</b><p style="color:var(--mut);font-size:14px">Trabajas 7 días (miércoles a martes) y descansas 7. Indica un miércoles en que empieza un bloque de trabajo y de qué turno es; el resto se calcula solo. Cualquier día se puede corregir a mano desde el calendario.</p>';
 h+='<div class="fld"><label>Miércoles de inicio de un bloque de trabajo</label><input type="date" value="'+f.start+'" onchange="S.cfg.start=this.value;save();draw()"></div>';
 h+='<div class="fld"><label>Turno de ese bloque</label><select onchange="S.cfg.first=this.value;save();draw()">'+['M','T','N'].map(function(c){return'<option value="'+c+'"'+(f.first===c?' selected':'')+'>'+SH[c].i+' '+SH[c].n+'</option>'}).join('')+'</select></div>';
 h+='<div class="fld"><label>Orden de rotación</label><select onchange="S.cfg.seq=this.value.split(\'\');save();draw()">';
 [['MTN','Mañana → Tarde → Noche'],['MNT','Mañana → Noche → Tarde'],['TNM','Tarde → Noche → Mañana']].forEach(function(o){h+='<option value="'+o[0]+'"'+(f.seq.join('')===o[0]?' selected':'')+'>'+o[1]+'</option>'});
 h+='</select></div><button class="btn red" onclick="if(confirm(\'¿Borrar todos los datos?\')){S=JSON.parse(JSON.stringify(DEF));save();draw()}">Borrar todos los datos</button></div>';
 $('t-cfg').innerHTML=h}
SH['']={n:'Sin asignar',i:'➖'};
function cyc(k){var p=k.split('-'),q=S.cfg.start.split('-');var d=Math.round((Date.UTC(+p[0],p[1]-1,+p[2])-Date.UTC(+q[0],q[1]-1,+q[2]))/864e5);var seq=S.cfg.seq,len=14*seq.length,c=((d%len)+len)%len;var off=seq.indexOf(S.cfg.first);if(off<0)off=0;if(c%14>=7)return'L';return seq[(Math.floor(c/14)+off)%seq.length]}
function base(k){return S.cfg.auto?cyc(k):'L'}
var ESC='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72"><path d="M32 3 6 12v22c0 17 11 29 26 35 15-6 26-18 26-35V12z" fill="#12306b" stroke="#f0b400" stroke-width="4"/><text x="32" y="44" text-anchor="middle" font-size="24">🚓</text></svg>');
function escSrc(){var v=null;try{v=localStorage.getItem('plesc')}catch(e){}return v||ESC}
function setEsc(){document.querySelectorAll('img.esc').forEach(function(i){i.src=escSrc()})}
function loadEsc(f){if(!f.files[0])return;var r=new FileReader();r.onload=function(){try{localStorage.setItem('plesc',r.result)}catch(e){}setEsc()};r.readAsDataURL(f.files[0])}
function enter(){var n=$('u').value.trim();if(n)S.name=n;save();$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=S.name?'Agente: '+S.name:'Policía Local de Pilar de la Horadada';go('turnos')}
function go(){$('menu').classList.add('hide');$('turnos').classList.remove('hide');$('back').classList.add('hide');draw()}
var rf='',rt='',rs='M';
function rangeCard(){return '<div class="card"><b>⚡ Asignar turnos por rango</b><p style="color:var(--mut);font-size:14px;margin:4px 0 8px">Elige desde qué día hasta qué día y el turno. Después puedes corregir días sueltos.</p><div class="row"><input type="date" id="rf" value="'+rf+'"><input type="date" id="rt" value="'+rt+'"></div><div class="row"><select id="rs">'+['M','T','N','L',''].map(function(c){return '<option value="'+c+'"'+(rs===c?' selected':'')+'>'+SH[c].i+' '+SH[c].n+'</option>'}).join('')+'</select><button class="btn" onclick="applyR()">Aplicar</button></div></div>'}
