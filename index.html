<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Policía Local · GAO</title>
<meta name="theme-color" content="#0c172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Policía Local">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f3f6;
  --card:#ffffff;
  --tx:#132036;
  --mut:#5b677d;
  --navy:#162844;
  --navy2:#0c172a;
  --navy3:#21385c;
  --gold:#c89d3c;
  --gold2:#e0ba63;
  --crimson:#7d1d2c;
  --line:#d7dce5;
  --M:#c99c3c;
  --T:#a55a2c;
  --N:#1c3154;
  --L:#3a6b52;
  --Lbg:#e4eee8;
  --X:#7d1d2c;
  --ok:#3a6b52;
  --shadow:0 2px 10px rgba(12,23,42,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08101d;
    --card:#101c30;
    --tx:#edf1f7;
    --mut:#8e9db5;
    --line:#21324f;
    --navy:#1a3052;
    --navy2:#0a1324;
    --Lbg:#172e26;
    --shadow:0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08101d;
  --card:#101c30;
  --tx:#edf1f7;
  --mut:#8e9db5;
  --line:#21324f;
  --navy:#1a3052;
  --navy2:#0a1324;
  --Lbg:#172e26;
  --shadow:0 4px 16px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.svg{display:inline-block;vertical-align:-0.16em;flex-shrink:0}

/* Top bar */
.top{
  background:linear-gradient(180deg,var(--navy2),var(--navy));
  color:#fff;
  padding:11px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:3px solid var(--gold);
  box-shadow:0 2px 12px rgba(0,0,0,.22);
}
.top img.esc{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.top h1{font-size:16px;font-weight:700;letter-spacing:.03em;margin:0;flex:1;line-height:1.2;text-transform:uppercase}
.top small{display:block;font-weight:400;letter-spacing:.01em;text-transform:none;color:var(--gold2);font-size:12px;margin-top:1px}

/* Buttons */
.btn{
  border:0;
  border-radius:9px;
  padding:9px 15px;
  cursor:pointer;
  font-weight:600;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  color:#0e1a2e;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  transition:filter .15s,transform .1s;
}
.btn:active{transform:scale(.98)}
.btn.sec{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.w{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#fff;padding:6px 12px;font-size:13px}
.btn.red{background:var(--crimson);color:#fff}
.btn.ico{padding:7px 9px}
.wrap{max-width:900px;margin:0 auto;padding:14px}

/* Login */
#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:radial-gradient(circle at 50% 28%,#1d3357 0%,var(--navy2) 72%);
}
.lcard{
  background:var(--card);
  border-radius:16px;
  padding:30px 24px 26px;
  width:100%;
  max-width:360px;
  text-align:center;
  border:1px solid rgba(200,157,60,.35);
  border-top:5px solid var(--gold);
  box-shadow:0 18px 42px rgba(0,0,0,.45);
}
.lcard img.esc{width:116px;height:116px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));margin-bottom:4px}
.lcard h2{margin:8px 0 2px;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx)}
.lcard .sub{margin:0 0 18px;color:var(--mut);font-size:13px;letter-spacing:.02em}
.lcard .badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--crimson);padding:3px 10px;border-radius:20px;border:1px solid rgba(200,157,60,.55);margin-bottom:14px}
.lcard input{width:100%;padding:11px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center}
.lcard input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.lcard .btn{width:100%;padding:11px}

/* Menu */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-bottom:3px solid var(--gold);border-radius:12px;padding:18px 10px;text-align:center;cursor:pointer;font-weight:600;box-shadow:var(--shadow)}
.tile .ic{display:flex;align-items:center;justify-content:center;width:48px;height:48px;margin:0 auto 10px;border-radius:12px;background:rgba(200,157,60,.12);color:var(--gold)}
.tile.soon{opacity:.5;cursor:default;border-bottom-color:var(--line)}
.tile small{display:block;font-weight:400;color:var(--mut);margin-top:2px}

/* Tabs & Cards */
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{
  padding:7px 13px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--card);
  cursor:pointer;
  font-weight:600;
  font-size:13.5px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:background .15s,border-color .15s,color .15s;
}
.tab.on{background:var(--navy);color:#fff;border-color:var(--gold)}
.tab.on-x{background:var(--crimson);color:#fff;border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-hd{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;margin-bottom:4px;color:var(--tx)}
.card-hd .svg{color:var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.bar h3{margin:0;text-transform:capitalize;font-size:17px;letter-spacing:.01em}

/* Total banner */
.total{
  background:linear-gradient(135deg,var(--navy2),var(--navy));
  color:#fff;
  border-radius:12px;
  padding:13px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  border:1px solid rgba(200,157,60,.3);
  border-left:5px solid var(--gold);
  box-shadow:var(--shadow);
}
.total .tl{display:flex;align-items:center;gap:10px}
.total .ti{width:36px;height:36px;border-radius:9px;background:rgba(200,157,60,.16);color:var(--gold2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.total b{font-size:23px;color:var(--gold2);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.total small{opacity:.82;font-size:12px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dh{text-align:center;font-size:11px;letter-spacing:.05em;color:var(--mut);font-weight:700;padding:3px 0;text-transform:uppercase}
.dc{
  min-height:86px;
  border:1px solid var(--line);
  border-radius:9px;
  padding:5px 3px 4px;
  background:var(--card);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  text-align:center;
  gap:2px;
  overflow:hidden;
  transition:transform .08s,box-shadow .12s;
}
.dc:active{transform:scale(.97)}
.dc .n{width:100%;font-size:12px;font-weight:700;display:flex;justify-content:space-between;padding:0 2px;font-variant-numeric:tabular-nums}
.dc .s{display:flex;flex-direction:column;align-items:center;gap:1px}
.dc .si{display:flex;align-items:center;justify-content:center;height:22px}
.dc .sl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.92}
.dc .x{display:flex;align-items:center;justify-content:center;gap:2px;flex-wrap:wrap;min-height:15px}
.dc .xi{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;background:rgba(0,0,0,.22);color:var(--gold2)}
.dc .xn{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:4px;background:rgba(255,255,255,.18);color:currentColor}

/* Shift Colors - GAO Harmonized */
.dc[data-s="M"]{background:var(--M);border-color:#b3882e;color:#0e1a2e}
.dc[data-s="M"] .xi{background:rgba(14,26,46,.16);color:#0e1a2e}
.dc[data-s="T"]{background:var(--T);border-color:#8d4b22;color:#fff}
.dc[data-s="N"]{background:var(--N);border-color:#2a4572;color:#f3f6fb}
.dc[data-s="L"]{background:var(--Lbg);border-color:rgba(58,107,82,.35);color:var(--tx)}
.dc[data-s="L"] .si{color:var(--L)}
.dc[data-s="L"] .xi{background:rgba(125,29,44,.14);color:var(--crimson)}

/* Extra highlight - GAO Burgundy ribbon + antique gold frame */
.dc[data-x="1"]{
  background:linear-gradient(180deg,#8d2132,var(--X));
  border:1.5px solid var(--gold);
  color:#fff;
  box-shadow:inset 0 0 0 1px rgba(224,186,99,.25);
}
.dc[data-x="1"] .si{color:rgba(255,255,255,.92)}
.dc[data-x="1"] .xi{background:rgba(12,23,42,.35);color:var(--gold2)}
.dc[data-x="1"][data-s="M"]{border-top:4px solid var(--M)}
.dc[data-x="1"][data-s="T"]{border-top:4px solid #c9723b}
.dc[data-x="1"][data-s="N"]{border-top:4px solid #486ba3}
.dc[data-x="1"][data-s="L"]{border-top:4px solid var(--L)}

.dc.today{outline:2.5px solid var(--tx);outline-offset:-1px}
.dc[data-x="1"].today{outline:2.5px solid var(--gold2)}

/* Legend */
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px;align-items:center}
.leg-item{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Tables & Forms */
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.ic-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;background:rgba(200,157,60,.14);color:var(--navy);margin-right:6px;vertical-align:middle}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ic-badge{color:var(--gold2);background:rgba(200,157,60,.16)}}
:root[data-theme="dark"] .ic-badge{color:var(--gold2);background:rgba(200,157,60,.16)}

.row{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.row input,.row select,.fld input,.fld select{padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
.row input.nm{flex:1}.row input.am{width:86px;text-align:right;font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12.5px;font-weight:600;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{
  border:1px solid var(--line);
  color:var(--tx);
  background:var(--bg);
  border-radius:18px;
  padding:6px 11px;
  cursor:pointer;
  font-size:13px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:border-color .15s,background .15s;
}
.chip:hover{border-color:var(--gold)}
.chip .svg{color:var(--gold)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(8,16,29,.68);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.mb{background:var(--card);width:100%;max-width:490px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;border-top:4px solid var(--gold);box-shadow:0 -8px 30px rgba(0,0,0,.35)}
@media(min-width:600px){.modal{align-items:center}.mb{border-radius:16px}}
@media(max-width:600px){.wrap{padding:8px}.cal{gap:3px}.dc{min-height:80px;padding:4px 2px}}
</style>
</head>
<body>

<div id="login">
 <div class="lcard">
  <img class="esc" alt="Escudo Policía Local GAO">
  <h2>Policía Local</h2>
  <div class="badge">Grupo de Apoyo Operativo · GAO</div>
  <p class="sub">Pilar de la Horadada · Herramientas de servicio</p>
  <input id="u" placeholder="Nombre o nº de placa (NIP)" autocomplete="off">
  <button class="btn" onclick="enter()">Entrar al servicio</button>
 </div>
</div>

<div id="app" class="hide">
 <div class="top">
  <img class="esc" alt="Escudo GAO">
  <h1>Policía Local<small id="who">Pilar de la Horadada</small></h1>
  <button class="btn w hide" id="back" onclick="go('menu')">Menú</button>
  <button class="btn w" onclick="logout()" title="Salir">Salir</button>
 </div>
 <div class="wrap">
  <div id="menu" class="hide">
   <h2 style="margin-top:0;font-size:18px">Aplicaciones</h2>
   <div class="grid">
    <div class="tile" onclick="go('turnos')"><span class="ic" data-ic="cal"></span>Turnos y gratificaciones</div>
    <div class="tile soon"><span class="ic" data-ic="doc"></span>Informes<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic" data-ic="search"></span>Inteligencia<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic" data-ic="clip"></span>Procedimientos<small>Próximamente</small></div>
    <div class="tile soon"><span class="ic" data-ic="car"></span>Servicios<small>Próximamente</small></div>
   </div>
  </div>
  <div id="turnos" class="hide">
   <div id="topc"></div>
   <div class="tabs" id="maintabs">
    <button class="tab on" data-t="cal" id="tab-cal"></button>
    <button class="tab" data-t="cat" id="tab-cat"></button>
    <button class="tab" data-t="cfg" id="tab-cfg"></button>
   </div>
   <div id="t-cal"></div>
   <div id="t-cat" class="hide"></div>
   <div id="t-cfg" class="hide"></div>
  </div>
 </div>
</div>
<div id="modal" class="modal hide"></div>

<script>
/* Vector SVG icon set harmonized with GAO tactical style */
var SVGS={
  M:'<path d="M12 3v3m-6.4 2.6 2.1 2.1m10.7-2.1-2.1 2.1M4 17h16M7 17a5 5 0 0 1 10 0"/>',
  T:'<path d="M12 9V5m-6.4 6.6 2.1 2.1m10.7-2.1-2.1 2.1M3 17h18M7 17a5 5 0 0 1 10 0M8 21h8"/>',
  N:'<path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.8 6.8 0 0 0 11 11z"/><path d="M17.5 4.5v3m-1.5-1.5h3"/>',
  L:'<path d="M12 21c0-6 4-10 9-12-1 6-5 10-9 12z"/><path d="M12 21c0-6-4-10-9-12 1 6 5 10 9 12z"/><path d="M12 21V9"/>',
  none:'<path d="M5 12h14"/>',
  shield:'<path d="M12 3l7 3v5c0 5-3.2 8.4-7 10-3.8-1.6-7-5-7-10V6l7-3z"/><path d="M12 8v5m-2.5-2.5h5"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/>',
  siren:'<path d="M7 18v-5a5 5 0 0 1 10 0v5M5 18h14a1 1 0 0 1 1 1v2H4v-2a1 1 0 0 1 1-1zM12 3v2M4.5 7.5l1.5 1.5M19.5 7.5 18 9"/>',
  car:'<path d="M5 16l1.5-5A2 2 0 0 1 8.4 9.5h7.2a2 2 0 0 1 1.9 1.5L19 16"/><rect x="3" y="15" width="18" height="4" rx="1.5"/><path d="M6 19v2m12-2v2M10 9.5V7h4v2.5"/>',

  cfg:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M2 12h3m14 0h3M4.9 19.1 7 17m10-10 2.1-2.1"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  bolt:'<polygon points="13 2 4 14 11 14 10 22 20 10 13 10 13 2"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13"/>',
  note:'<path d="M6 3h9l4 4v14H6V3z"/><path d="M14 3v5h5M9 12h6M9 16h6"/>',
  bell:'<path d="M18 16H6l1.5-2V10a4.5 4.5 0 0 1 9 0v4L18 16z"/><path d="M10 19a2 2 0 0 0 4 0"/>',
  save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-7H7v7M7 3v5h8"/>',
  prev:'<path d="M15 6l-6 6 6 6"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  doc:'<path d="M6 3h9l4 4v14H6V3z"/><path d="M9 12h6M9 16h4"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/>'
};

/* Map legacy emojis stored in localStorage to sleek GAO SVG keys */
var LEGACY={
  '👮':'shield','🌙':'moon','🚨':'siren','🚓':'car','⭐':'star',
  '📋':'clip','⚖️':'scale','🏍️':'moto','🎖️':'award','🎉':'spark',
  '🌅':'M','🌇':'T','🏖️':'L','➖':'none'
};

var ICON_OPTS=[
  ['shield','Escudo / Agente'],
  ['moon','Nocturno / Festivo'],
  ['siren','Festivo nocturno'],
  ['car','Servicio especial'],
  ['star','Extraordinario'],
  ['clip','Consideración'],
  ['scale','Juzgado'],
  ['moto','Moto'],
  ['award','Jefatura / Mando'],
  ['spark','Otro extra']
];

function svg(name,sz){
  var k=LEGACY[name]||name;
  var p=SVGS[k]||SVGS.star;
  var s=sz||16;
  return '<svg class="svg" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';
}

var SH={
  M:{n:'Mañana',i:'M'},
  T:{n:'Tarde',i:'T'},
  N:{n:'Noche',i:'N'},
  L:{n:'Libre',i:'L'},
  '':{n:'Sin asignar',i:'none'}
};

var DEF_CAT=[
  {id:1,n:'Agente Ordinario (AO · 8h)',a:250.08,i:'shield'},
  {id:2,n:'Agente Festivo/Nocturno (AF/AN · 8h)',a:280.80,i:'moon'},
  {id:3,n:'Agente Festivo Nocturno (AFN · 8h)',a:311.60,i:'siren'},

function setEsc(){document.querySelectorAll('img.esc').forEach(function(i){i.src=ESC})}

function cyc(k){
  var p=k.split('-'),q=S.cfg.start.split('-');
  var d=Math.round((Date.UTC(+p[0],p[1]-1,+p[2])-Date.UTC(+q[0],q[1]-1,+q[2]))/864e5);
  var seq=S.cfg.seq,len=14*seq.length,c=((d%len)+len)%len;
  var off=seq.indexOf(S.cfg.first);if(off<0)off=0;
  if(c%14>=7)return'L';
  return seq[(Math.floor(c/14)+off)%seq.length];
}
function base(k){return S.cfg.auto?cyc(k):'L'}
function shiftOf(k){var o=S.days[k];return(o&&o.s)?o.s:base(k)}

function enter(){
  var n=$('u').value.trim();
  if(n)S.name=n;
  save();
  $('login').classList.add('hide');
  $('app').classList.remove('hide');
  $('who').textContent=S.name?('Agente: '+S.name+' · GAO'):'Pilar de la Horadada · GAO';
  go('turnos');
}
function logout(){$('app').classList.add('hide');$('login').classList.remove('hide')}
function go(){$('menu').classList.add('hide');$('turnos').classList.remove('hide');$('back').classList.add('hide');draw()}

function initStaticIcons(){
  $('tab-cal').innerHTML=svg('cal',15)+' Calendario';
  $('tab-cat').innerHTML=svg('eur',15)+' Gratificaciones';
  $('tab-cfg').innerHTML=svg('cfg',15)+' Ajustes';
  document.querySelectorAll('[data-ic]').forEach(function(el){el.innerHTML=svg(el.dataset.ic,24)});
}

document.querySelectorAll('#maintabs .tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#maintabs .tab').forEach(function(x){x.classList.toggle('on',x===b)});
    ['cal','cat','cfg'].forEach(function(t){$('t-'+t).classList.toggle('hide',t!==b.dataset.t)});
    draw();
  };
});

function draw(){drawCal();drawCat();drawCfg()}
function mv(n){Mo+=n;if(Mo<0){Mo=11;Y--}if(Mo>11){Mo=0;Y++}drawCal()}
function setV(m){vmode=m;drawCal()}
function setBrush(c){brush=c;var y=window.scrollY;drawCal();window.scrollTo(0,y)}

function dd(){return S.days[dk]||(S.days[dk]={s:'',x:[]})}
function clean(){var o=S.days[dk];if(o&&!o.s&&(!o.x||!o.x.length))delete S.days[dk]}

function openDay(k){
  dk=k;
  if(brush==='X'){drawModal();return}
  var o=dd();
  o.s=(brush===base(k))?'':brush;
  clean();save();
  var y=window.scrollY;drawCal();window.scrollTo(0,y);
}

function drawModal(){
  var o=S.days[dk]||{},s=o.s||'',x=o.x||[];
  var dt=new Date(dk+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
  var h='<div class="mb"><h3 style="margin:0 0 12px;text-transform:capitalize;font-size:17px">'+esc(dt)+'</h3>';
  h+='<div class="fld"><label>Turno del día</label><select id="ms" onchange="setShift(this.value)"><option value="">Por defecto ('+SH[base(dk)].n+')</option>';
  ['M','T','N','L'].forEach(function(c){h+='<option value="'+c+'"'+(s===c?' selected':'')+'>'+SH[c].n+'</option>'});
  h+='</select></div><div class="card-hd" style="font-size:14px">'+svg('eur',15)+' Gratificaciones del día</div>';
  if(!x.length)h+='<div style="color:var(--mut);font-size:13.5px;margin:4px 0 8px">Ninguna todavía</div>';
  x.forEach(function(e,j){
    h+='<div class="row"><span class="ic-badge" style="margin:0">'+svg(e.i,14)+'</span><input class="nm" value="'+esc(e.n)+'" onchange="upd('+j+',\'n\',this.value)"><input class="am" type="number" step="0.01" value="'+e.a+'" onchange="upd('+j+',\'a\',this.value)"><button class="btn sec ico" onclick="del('+j+')" title="Eliminar">'+svg('trash',15)+'</button></div>';
  });
  h+='<div style="margin-top:10px;font-size:12.5px;color:var(--mut)">Añadir (toca varias si hace falta):</div><div class="chips">';
  S.cat.forEach(function(c){
    h+='<button class="chip" onclick="addG('+c.id+')">'+svg(c.i,14)+' '+esc(c.n)+' · <b>'+eur(c.a)+'</b></button>';
  });
  var L=(S.notes||{})[dk]||[];
  h+='</div><div style="margin:12px 0;border-top:1px solid var(--line);padding-top:12px"><div class="card-hd" style="font-size:14px;margin-bottom:8px">'+svg('note',15)+' Anotaciones</div>';
  L.forEach(function(n,j){
    h+='<div class="row"><input type="checkbox" style="width:20px;height:20px;accent-color:var(--gold)" '+(n.done?'checked':'')+' onchange="togN('+j+')"><input class="nm" value="'+esc(n.x)+'" onchange="updN('+j+',\'x\',this.value)"><input type="time" style="width:98px" value="'+(n.t||'')+'" onchange="updN('+j+',\'t\',this.value)"><button class="btn sec ico" onclick="delN('+j+')">'+svg('trash',15)+'</button></div>';
  });
  h+='<div class="row"><input class="nm" id="nx" placeholder="Nueva anotación o recordatorio"><input type="time" id="nt" style="width:98px"><button class="btn ico" onclick="addN()" title="Añadir">'+svg('plus',16)+'</button></div></div>';
  h+='<div class="row" style="justify-content:space-between;margin-top:10px;margin-bottom:0"><b>Total del día: '+eur(x.reduce(function(a,e){return a+e.a},0))+'</b><button class="btn" onclick="closeM()">Hecho</button></div></div>';
  $('modal').innerHTML=h;$('modal').classList.remove('hide');
}
function closeM(){$('modal').classList.add('hide');draw()}
$('modal').onclick=function(e){if(e.target===$('modal'))closeM()};
function setShift(v){dd().s=v;clean();save();drawModal()}
function addG(id){var c=S.cat.filter(function(z){return z.id===id})[0];if(!c)return;dd().x.push({n:c.n,a:c.a,i:c.i});save();drawModal()}
function upd(j,f,v){var e=dd().x[j];e[f]=f==='a'?(parseFloat(v)||0):v;save();drawModal()}
function del(j){dd().x.splice(j,1);clean();save();drawModal()}

function nl(k){S.notes=S.notes||{};return S.notes[k]||(S.notes[k]=[])}
function addN(){var x=$('nx').value.trim(),t=$('nt').value;if(!x)return;nl(dk).push({x:x,t:t,done:0,nt:0});save();drawModal();dueCheck()}
function updN(j,f,v){var n=nl(dk)[j];n[f]=v;n.nt=0;save()}
function delN(j){nl(dk).splice(j,1);if(!S.notes[dk].length)delete S.notes[dk];save();drawModal()}
function togN(j){var n=nl(dk)[j];n.done=n.done?0:1;save();drawModal()}

function drawCat(){
  var h='<div class="card"><div class="card-hd">'+svg('eur',16)+' Tipos de gratificación</div><p style="color:var(--mut);font-size:13.5px;margin:4px 0 12px">Tarifas de Agente (turnos de 8 horas) y servicios generales. Cambiar un importe aquí no altera meses anteriores.</p>';
  S.cat.forEach(function(c,j){
    var curI=LEGACY[c.i]||c.i;
    h+='<div class="row"><span class="ic-badge" style="margin:0">'+svg(curI,15)+'</span><select style="width:128px;font-size:13px" onchange="cu('+j+',\'i\',this.value);drawCat()">'+ICON_OPTS.map(function(o){return'<option value="'+o[0]+'"'+(o[0]===curI?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select><input class="nm" value="'+esc(c.n)+'" onchange="cu('+j+',\'n\',this.value)"><input class="am" type="number" step="0.01" value="'+c.a+'" onchange="cu('+j+',\'a\',this.value)"><button class="btn sec ico" onclick="cd('+j+')" title="Eliminar">'+svg('trash',15)+'</button></div>';
  });
  h+='<div class="row" style="margin-top:12px;margin-bottom:0;justify-content:space-between;flex-wrap:wrap"><button class="btn" onclick="ca()">'+svg('plus',15)+' Nuevo tipo</button><button class="btn sec" style="font-size:13px" onclick="resetCat()">'+svg('refresh',14)+' Restaurar tarifas Agente</button></div></div>';
  $('t-cat').innerHTML=h;
}
function cu(j,f,v){S.cat[j][f]=f==='a'?(parseFloat(v)||0):v;save()}
function cd(j){S.cat.splice(j,1);save();drawCat()}
function ca(){S.cat.push({id:S.nid++,n:'Nueva gratificación',a:0,i:'star'});save();drawCat()}
function resetCat(){if(!confirm('¿Restaurar la lista oficial de gratificaciones de Agente? Tus turnos y días ya guardados no se borrarán.'))return;S.cat=JSON.parse(JSON.stringify(DEF_CAT));S.nid=12;save();drawCat()}

function openRange(){
  var o=['M','T','N','L'].map(function(c){return '<option value="'+c+'"'+(rs===c?' selected':'')+'>'+SH[c].n+'</option>'}).join('');
  $('modal').innerHTML='<div class="mb"><div class="card-hd" style="font-size:16px;margin-bottom:6px">'+svg('bolt',16)+' Asignar turnos por rango</div><p style="color:var(--mut);font-size:13.5px;margin:0 0 12px">Aplica el mismo turno en varios días seguidos. Después puedes corregir días sueltos.</p><div class="fld"><label>Desde</label><input type="date" id="rf" value="'+rf+'"></div><div class="fld"><label>Hasta</label><input type="date" id="rt" value="'+rt+'"></div><div class="fld"><label>Turno</label><select id="rs">'+o+'</select></div><div class="row" style="justify-content:flex-end;margin-bottom:0"><button class="btn sec" onclick="closeR()">Cancelar</button><button class="btn" onclick="applyR()">Aplicar</button></div></div>';
  $('modal').classList.remove('hide');
}
function closeR(){$('modal').classList.add('hide')}
function applyR(){
  rf=$('rf').value;rt=$('rt').value;rs=$('rs').value;
  if(!rf||!rt||rt<rf){alert('Indica un rango válido');return}
  var d=new Date(rf+'T12:00:00'),e=new Date(rt+'T12:00:00'),n=0;
  while(d<=e&&n<400){
    var k=key(d.getFullYear(),d.getMonth(),d.getDate());
    var o=S.days[k]||(S.days[k]={s:'',x:[]});
    o.s=(rs===base(k))?'':rs;
    if(!o.s&&!(o.x&&o.x.length))delete S.days[k];
    d.setDate(d.getDate()+1);n++;
  }
  save();closeR();drawCal();
}

function notesCard(){
  var t=new Date(),tk=key(t.getFullYear(),t.getMonth(),t.getDate()),rows=[];
  Object.keys(S.notes||{}).sort().forEach(function(k){
    if(k>=tk)S.notes[k].forEach(function(n){if(!n.done)rows.push([k,n])});
  });
  var h='<div class="card"><div class="card-hd">'+svg('note',15)+' Próximas anotaciones</div>';
  if(!rows.length)h+='<p style="color:var(--mut);font-size:13.5px;margin:6px 0 0">Sin anotaciones pendientes. Selecciona «Extras y notas» y toca un día para añadir.</p>';
  rows.slice(0,8).forEach(function(r){
    h+='<div class="row" style="margin:6px 0"><span style="color:var(--mut);font-size:13px;min-width:94px">'+new Date(r[0]+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})+(r[1].t?' · '+r[1].t:'')+'</span><span>'+esc(r[1].x)+'</span></div>';
  });
  return h+'</div>';
}

function drawCal(){
  var s,e;
  if(vmode==='P'){s=new Date(Y,Mo-1,25);e=new Date(Y,Mo,24)}
  else{s=new Date(Y,Mo,1);e=new Date(Y,Mo+1,0)}
  var nm=new Date(Y,Mo,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  var fm=function(d){return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'})};
  var tot=0,agg={},cnt={L:0,M:0,T:0,N:0},cells=[];
  for(var d=new Date(s);d<=e;d.setDate(d.getDate()+1)){
    var k=key(d.getFullYear(),d.getMonth(),d.getDate()),sh=shiftOf(k),o=S.days[k];
    cnt[sh]++;
    if(o&&o.x)o.x.forEach(function(g){
      tot+=g.a;
      var a=agg[g.n]||(agg[g.n]={c:0,t:0,i:g.i});
      a.c++;a.t+=g.a;
    });
    cells.push({k:k,d:d.getDate(),m:d.getMonth(),sh:sh,o:o});
  }
  var t=new Date(),tk=key(t.getFullYear(),t.getMonth(),t.getDate());
  var h='<div class="card" style="padding:10px 8px"><div class="bar"><button class="btn sec ico" onclick="mv(-1)" aria-label="Anterior">'+svg('prev',16)+'</button><h3 style="text-align:center">'+esc(nm)+(vmode==='P'?'<br><small style="font-weight:400;color:var(--mut);text-transform:none;font-size:12px">'+fm(s)+' – '+fm(e)+'</small>':'')+'</h3><button class="btn sec ico" onclick="mv(1)" aria-label="Siguiente">'+svg('next',16)+'</button></div><div class="cal">';
  ['L','M','X','J','V','S','D'].forEach(function(x){h+='<div class="dh">'+x+'</div>'});
  for(var i=0;i<(s.getDay()+6)%7;i++)h+='<div></div>';
  cells.forEach(function(c,ix){
    var mon=(ix===0||c.d===1)?new Date(2000,c.m,1).toLocaleDateString('es-ES',{month:'short'}):'';
    var xHtml='';
    if(c.o&&c.o.x&&c.o.x.length){
      c.o.x.forEach(function(g){xHtml+='<span class="xi">'+svg(g.i,10)+'</span>'});
    }
    if(S.notes&&S.notes[c.k]&&S.notes[c.k].length){
      xHtml+='<span class="xn">'+svg('note',10)+'</span>';
    }
    var hx=(c.o&&c.o.x&&c.o.x.length)?'1':'0';
    h+='<div class="dc'+(c.k===tk?' today':'')+'" data-s="'+c.sh+'" data-x="'+hx+'" onclick="openDay(\''+c.k+'\')"><div class="n"><span>'+c.d+'</span><span style="font-weight:400;opacity:.75;font-size:10px">'+mon+'</span></div><div class="s"><span class="si">'+svg(SH[c.sh].i,19)+'</span><span class="sl">'+SH[c.sh].n.slice(0,3)+'</span></div><div class="x">'+xHtml+'</div></div>';
  });
  h+='</div><div class="leg" style="margin-top:10px;justify-content:center">';
  h+='<span class="leg-item"><i class="sw" style="background:var(--M)"></i> Mañana</span>';
  h+='<span class="leg-item"><i class="sw" style="background:var(--T)"></i> Tarde</span>';
  h+='<span class="leg-item"><i class="sw" style="background:var(--N)"></i> Noche</span>';
  h+='<span class="leg-item"><i class="sw" style="background:var(--L)"></i> Libre</span>';
  h+='<span class="leg-item" style="font-weight:600;color:var(--tx)"><i class="sw" style="background:var(--X);border:1.5px solid var(--gold)"></i> Con extra</span>';
  h+='</div></div>';

  h+='<div class="card" style="padding:10px 12px"><div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">Selecciona un turno y toca los días para asignarlo. Usa <b>Extras y notas</b> para registrar gratificaciones.</div><div class="tabs" style="margin:0">';
  ['M','T','N','L'].forEach(function(c){
    h+='<button class="tab'+(brush===c?' on':'')+'" onclick="setBrush(\''+c+'\')">'+svg(SH[c].i,14)+' '+SH[c].n+'</button>';
  });
  h+='<button class="tab'+(brush==='X'?' on-x':'')+'" onclick="setBrush(\'X\')">'+svg('plus',14)+' Extras y notas</button>';
  h+='<button class="tab" onclick="openRange()">'+svg('bolt',14)+' Por rango</button></div></div>';
  $('topc').innerHTML=h;

  var g='<div class="total"><div class="tl"><span class="ti">'+svg('eur',20)+'</span><span>'+(vmode==='P'?'Cobro de <span style="text-transform:capitalize">'+esc(nm)+'</span><br><small>Periodo del '+fm(s)+' al '+fm(e)+'</small>':'Gratificaciones de <span style="text-transform:capitalize">'+esc(nm)+'</span><br><small>Mes natural</small>')+'</span></div><b>'+eur(tot)+'</b></div>';
  g+='<div class="tabs"><button class="tab'+(vmode==='N'?' on':'')+'" onclick="setV(\'N\')">Mes natural</button><button class="tab'+(vmode==='P'?' on':'')+'" onclick="setV(\'P\')">Periodo de cobro (25 → 24)</button></div>';
  g+='<div class="card"><div class="card-hd">'+svg('clip',15)+' Resumen '+(vmode==='P'?'del periodo de cobro':'del mes')+'</div><table><tr><th>Concepto</th><th>Nº</th><th>Importe</th></tr>';
  var ks=Object.keys(agg);
  if(!ks.length)g+='<tr><td colspan="3" style="color:var(--mut)">Sin gratificaciones registradas en este periodo.</td></tr>';
  ks.forEach(function(n){g+='<tr><td><span class="ic-badge">'+svg(agg[n].i,14)+'</span>'+esc(n)+'</td><td>'+agg[n].c+'</td><td>'+eur(agg[n].t)+'</td></tr>'});
  g+='<tr><td><b>TOTAL</b></td><td></td><td><b>'+eur(tot)+'</b></td></tr></table><div class="leg"><span>Días de servicio: <b>'+(cnt.M+cnt.T+cnt.N)+'</b></span><span>Libres: <b>'+cnt.L+'</b></span></div></div>';
  $('t-cal').innerHTML=g+notesCard();
}

function permHtml(){
  var p='no disponible aquí';
  try{p=Notification.permission==='granted'?'activados':(Notification.permission==='denied'?'bloqueados':'sin activar')}catch(e){}
  return '<div class="card"><div class="card-hd">'+svg('bell',15)+' Avisos de recordatorios</div><p style="color:var(--mut);font-size:13.5px;margin:4px 0 10px">El aviso salta el día de la anotación (a la hora indicada) mientras la app esté abierta. Estado: <b>'+p+'</b>.</p><button class="btn" onclick="askPerm()">Activar avisos</button></div>';
}
function askPerm(){try{Notification.requestPermission().then(function(){draw()})}catch(e){banner('Este navegador no permite notificaciones aquí. Los avisos saldrán dentro de la app.','')}}

function backupCard(){
  return '<div class="card"><div class="card-hd">'+svg('save',15)+' Copia de seguridad</div><p style="color:var(--mut);font-size:13.5px;margin:4px 0 10px">Tus datos se guardan solo en este dispositivo. Copia el texto para guardarlo o pasarlo a otro móvil.</p><div class="row"><button class="btn sec" onclick="$(\'bk\').value=JSON.stringify(S)">Mostrar copia</button><button class="btn sec" onclick="restore()">Restaurar</button></div><textarea id="bk" rows="4" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font-size:12px"></textarea></div>';
}
function restore(){try{var o=JSON.parse($('bk').value);if(!o.cfg||!o.cat)throw 0;S=o;save();draw();alert('Datos restaurados correctamente')}catch(e){alert('Texto no válido')}}

function drawCfg(){
  var f=S.cfg;
  var h=permHtml();
  h+='<div class="card"><label style="display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:600"><input type="checkbox" style="width:18px;height:18px;accent-color:var(--gold)" '+(f.auto?'checked':'')+' onchange="S.cfg.auto=this.checked;save();draw()"> Rellenar automáticamente con el ciclo 7×7</label></div>';
  h+=backupCard();
  h+='<div class="card"><div class="card-hd">'+svg('cal',15)+' Ciclo de turnos 7×7</div><p style="color:var(--mut);font-size:13.5px;margin:4px 0 12px">Trabajas 7 días (miércoles a martes) y descansas 7. Indica un miércoles de inicio y su turno; cualquier día se puede corregir a mano.</p>';
  h+='<div class="fld"><label>Miércoles de inicio de un bloque de trabajo</label><input type="date" value="'+f.start+'" onchange="S.cfg.start=this.value;save();draw()"></div>';
  h+='<div class="fld"><label>Turno de ese bloque</label><select onchange="S.cfg.first=this.value;save();draw()">'+['M','T','N'].map(function(c){return'<option value="'+c+'"'+(f.first===c?' selected':'')+'>'+SH[c].n+'</option>'}).join('')+'</select></div>';
  h+='<div class="fld"><label>Orden de rotación</label><select onchange="S.cfg.seq=this.value.split(\'\');save();draw()">';
  [['MTN','Mañana → Tarde → Noche'],['MNT','Mañana → Noche → Tarde'],['TNM','Tarde → Noche → Mañana']].forEach(function(o){
    h+='<option value="'+o[0]+'"'+(f.seq.join('')===o[0]?' selected':'')+'>'+o[1]+'</option>';
  });
  h+='</select></div><button class="btn red" onclick="if(confirm(\'¿Borrar todos los datos guardados?\')){S=JSON.parse(JSON.stringify(DEF));save();draw()}">'+svg('trash',15)+' Borrar todos los datos</button></div>';
  $('t-cfg').innerHTML=h;
}

function banner(x,t){
  var b=document.getElementById('bn');
  if(!b){b=document.createElement('div');b.id='bn';b.style.cssText='position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:99;display:flex;flex-direction:column;gap:6px';document.body.appendChild(b)}
  var d=document.createElement('div');
  d.style.cssText='background:var(--navy2);color:#fff;border:1px solid rgba(200,157,60,.4);border-left:5px solid var(--gold);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45)';
  d.innerHTML='<span style="color:var(--gold2)">'+svg('bell',20)+'</span><span style="flex:1">'+(t?'<b>'+esc(t)+'</b> · ':'')+esc(x)+'</span><button class="btn" style="padding:5px 11px;font-size:13px" onclick="this.parentNode.remove()">OK</button>';
  b.appendChild(d);
}
function fire(x,t){try{if('Notification' in window&&Notification.permission==='granted')new Notification('Policía Local · Recordatorio',{body:(t?t+' · ':'')+x})}catch(e){}banner(x,t)}
function dueCheck(){
  var t=new Date(),k=key(t.getFullYear(),t.getMonth(),t.getDate()),hm=pad(t.getHours())+':'+pad(t.getMinutes()),L=(S.notes||{})[k]||[],ch=false;
  L.forEach(function(n){if(n.done||n.nt)return;if(n.t&&n.t>hm)return;n.nt=1;ch=true;fire(n.x,n.t)});
  if(ch)save();
}
setInterval(dueCheck,30000);document.addEventListener('visibilitychange',dueCheck);

initStaticIcons();
$('u').value=S.name||'';
setEsc();
if(S.name)enter();
dueCheck();
</script>
</body>
</html>
